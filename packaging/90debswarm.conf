// Routes APT through the local debswarm proxy.
//
// This file is managed by the debswarm package: it is written on install and
// upgrade and deleted on remove, so a removed debswarm never leaves APT
// pointing at a script that no longer exists. Do not edit it; local changes
// are overwritten. Put your own settings in
// /etc/apt/apt.conf.d/91debswarm-direct.conf, which is read after this file
// and kept across upgrades.
//
// The proxy is applied via auto-detection rather than a hard
// Acquire::http::Proxy setting: APT runs the detect script, which answers
// with the proxy URL while the daemon is reachable and with DIRECT when it
// is not. A stopped or crashed daemon therefore degrades to direct mirror
// access instead of breaking every apt operation.

Acquire::http::Proxy-Auto-Detect "/usr/lib/debswarm/apt-proxy-detect";
Acquire::https::Proxy-Auto-Detect "/usr/lib/debswarm/apt-proxy-detect";
